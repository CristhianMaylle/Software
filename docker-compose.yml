# Finance Control API — orquestación FastAPI + PostgreSQL 18.
# - api: se publica vía Traefik v3 (red externa "web") en oswalbot.itelcore.org.
#   No expone puertos al host: solo Traefik llega por la red "web".
# - db: PostgreSQL 18, solo accesible por la red interna "default" (sin puertos).
# Una sola fuente de verdad para credenciales: el archivo .env (no versionado).

services:
  api:
    build: .
    container_name: finance_control_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # python siempre está en la imagen slim; urlopen sale != 0 si /health no da 200.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.services.finance.loadbalancer.server.port=8000"
      # oswalbot.itelcore.org cae bajo el wildcard *.itelcore.org del Origin Cert
      # de Cloudflare (default cert store de Traefik) -> tls=true SIN certresolver.
      - "traefik.http.routers.finance.rule=Host(`oswalbot.itelcore.org`)"
      - "traefik.http.routers.finance.entrypoints=websecure"
      - "traefik.http.routers.finance.tls=true"
      # --- Protección: rate limit por IP real del cliente + security headers ---
      - "traefik.http.routers.finance.middlewares=finance-ratelimit,finance-headers"
      # Rate limit: 60 req/min sostenido, ráfaga 20, por IP real (header Cf-Connecting-Ip
      # que inyecta Cloudflare; sin él, Traefik solo vería la IP del edge de CF).
      - "traefik.http.middlewares.finance-ratelimit.ratelimit.average=60"
      - "traefik.http.middlewares.finance-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.finance-ratelimit.ratelimit.burst=20"
      - "traefik.http.middlewares.finance-ratelimit.ratelimit.sourcecriterion.requestheadername=Cf-Connecting-Ip"
      # Security headers (defensa en profundidad; Cloudflare ya añade varios).
      - "traefik.http.middlewares.finance-headers.headers.stsseconds=31536000"
      - "traefik.http.middlewares.finance-headers.headers.stsincludesubdomains=true"
      - "traefik.http.middlewares.finance-headers.headers.contenttypenosniff=true"
      - "traefik.http.middlewares.finance-headers.headers.referrerpolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.finance-headers.headers.framedeny=true"
    networks:
      - default
      - web

  db:
    image: postgres:18-alpine
    container_name: finance_control_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-finance}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finance_secret}
      POSTGRES_DB: ${DB_NAME:-finance_control}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${DB_USER:-finance} -d ${DB_NAME:-finance_control}"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

volumes:
  pgdata:

networks:
  web:
    external: true
